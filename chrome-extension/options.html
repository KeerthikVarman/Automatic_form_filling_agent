<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Udyam AI Assistant Settings</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #111827;
      --border: #374151;
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 24px;
      line-height: 1.5;
      min-width: 420px;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    .logo {
      width: 36px;
      height: 36px;
      border-radius: 8px;
    }

    h1 {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #e5e7eb;
    }

    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }

    .radio-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.88rem;
      cursor: pointer;
    }

    input[type="text"] {
      width: 100%;
      background: #1f2937;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text);
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    .help-text {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
    }

    button {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
    }

    #statusMessage {
      font-size: 0.82rem;
      color: var(--success);
      margin-top: 12px;
      text-align: center;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="icons/icon48.png" alt="Logo" class="logo">
      <div>
        <h1>Udyam AI Assistant</h1>
        <p class="subtitle">Extension Configuration & URL Settings</p>
      </div>
    </div>

    <form id="settingsForm">
      <div class="form-group">
        <label>Active Target Environment:</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="environment" value="local" id="envLocal">
            <span><strong>Local Development</strong> (Default)</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="environment" value="production" id="envProduction">
            <span><strong>Production Server</strong></span>
          </label>
        </div>
      </div>

      <div class="form-group">
        <label for="localUrl">Local Application URL:</label>
        <input type="text" id="localUrl" placeholder="http://localhost:5173">
        <p class="help-text">Matches the local Vite dev server (default: http://localhost:5173)</p>
      </div>

      <div class="form-group">
        <label for="productionUrl">Production Application URL:</label>
        <input type="text" id="productionUrl" placeholder="https://your-domain.com">
        <p class="help-text">Used when the environment is set to Production</p>
      </div>

      <div class="form-group">
        <label for="backendUrl">FastAPI Backend API URL (for Side Panel):</label>
        <input type="text" id="backendUrl" placeholder="http://localhost:8000">
        <p class="help-text">Target URL of the AI processing backend (default: http://localhost:8000)</p>
      </div>

      <div class="actions">
        <button type="button" id="resetBtn" class="btn-secondary">Reset Defaults</button>
        <button type="submit" class="btn-primary">Save Settings</button>
      </div>

      <div id="statusMessage"></div>
    </form>
  </div>

  <script type="module" src="options.js"></script>
</body>
</html>
